
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>OnView 교안 뷰어</title>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const slide = urlParams.get('slide') || 'phonics';
    const server = "http://onview.infy.uk"; // 
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("slideFrame").src = server + "/view.php?slide=" + slide;
    });
  </script>
  <style>body { margin:0; } iframe { width:100vw; height:100vh; border:none; }</style>
</head>
<body><iframe id="slideFrame"></iframe></body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>두두잉글리시 - 파닉스</title>
  <style>
    body {
      font-family: 'NanumSquare', sans-serif;
      padding: 20px;
      background-color: #f5f5f5;
    }

    h1 {
      color: #2c3e50;
    }

    .image {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .description {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      background-color: #3498db;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
    }

    .btn:hover {
      background-color: #2980b9;
    }
  </style>
</head>
<body>

  <h1>📘 두두잉글리시 - 파닉스</h1>

  <!-- 대표 이미지 -->
  <img src="../이미지폴더명/phonics.jpg" alt="파닉스 이미지" class="image">

  <!-- 설명 -->
  <div class="description">
    <h3>📌 파닉스란?</h3>
    <p>
      영어 단어의 철자와 소리를 연결하는 학습으로, 읽기와 쓰기의 기초가 되는 핵심 영역입니다.<br>
      두두잉글리시의 파닉스는 레벨별로 구성되어 있어 아이의 실력에 맞춰 탄탄한 기초를 다질 수 있어요.
    </p>
  </div>

  <!-- 상세 버튼 (세부 콘텐츠로 확장 가능) -->
  <div class="buttons">
    <a href="#" class="btn">레벨 1 보기</a>
    <a href="#" class="btn">레벨 2 보기</a>
    <a href="#" class="btn">게임형 파닉스</a>
    <a href="#" class="btn">파닉스 마무리 퀴즈</a>
  </div>

</body>
</html>
